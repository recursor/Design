<!doctype html>
<!-- @dsCard group="Colors" name="Color · Neutrals" subtitle="Warm grays toward navy" viewport="700x190" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <p class="label" style="margin:0 0 12px;">Neutrals · warm grays, tilted toward navy</p>
  <div style="display:grid; grid-template-columns:repeat(10,1fr); gap:4px;">
    <div class="swatch" style="background:#FFFFFF; border:1px solid #EEF0F4; min-height:60px;"><span class="name" style="font-size:10px;">0</span></div>
    <div class="swatch" style="background:#F7F8FA; min-height:60px;"><span class="name" style="font-size:10px;">50</span></div>
    <div class="swatch" style="background:#EEF0F4; min-height:60px;"><span class="name" style="font-size:10px;">100</span></div>
    <div class="swatch" style="background:#DDE2EA; min-height:60px;"><span class="name" style="font-size:10px;">200</span></div>
    <div class="swatch" style="background:#C4CBD7; min-height:60px;"><span class="name" style="font-size:10px;">300</span></div>
    <div class="swatch" style="background:#97A0B0; color:#fff; min-height:60px;"><span class="name" style="font-size:10px;">400</span></div>
    <div class="swatch dark" style="background:#6B7385; min-height:60px;"><span class="name" style="font-size:10px;">500</span></div>
    <div class="swatch dark" style="background:#4B5364; min-height:60px;"><span class="name" style="font-size:10px;">600</span></div>
    <div class="swatch dark" style="background:#343A48; min-height:60px;"><span class="name" style="font-size:10px;">700</span></div>
    <div class="swatch dark" style="background:#1F2330; min-height:60px;"><span class="name" style="font-size:10px;">800</span></div>
  </div>
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; font-size:11px;">
    <div><div style="font-weight:600; color:var(--fg-strong);">--fg</div><div style="font-family:var(--font-mono); color:var(--fg-subtle);">navy-950</div></div>
    <div><div style="font-weight:600; color:var(--fg-strong);">--fg-muted</div><div style="font-family:var(--font-mono); color:var(--fg-subtle);">neutral-600</div></div>
    <div><div style="font-weight:600; color:var(--fg-strong);">--border</div><div style="font-family:var(--font-mono); color:var(--fg-subtle);">neutral-200</div></div>
    <div><div style="font-weight:600; color:var(--fg-strong);">--bg-soft</div><div style="font-family:var(--font-mono); color:var(--fg-subtle);">neutral-50</div></div>
  </div>
</div></body></html>
