<!doctype html>
<!-- @dsCard group="Colors" name="Color · Semantic" subtitle="Success, warning, danger, info" viewport="700x190" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <p class="label" style="margin:0 0 12px;">Semantic · status · feedback</p>
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;">
    <div>
      <div style="height:54px; border-radius:8px; background:#2E9E6A; display:flex; align-items:flex-end; padding:8px; color:#fff; font-size:11px; font-weight:600;">Success</div>
      <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:6px;">#2E9E6A</div>
      <div style="height:14px; border-radius:3px; background:#E7F5EE; margin-top:4px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); margin-top:2px;">#E7F5EE bg</div>
    </div>
    <div>
      <div style="height:54px; border-radius:8px; background:#D08A2C; display:flex; align-items:flex-end; padding:8px; color:#fff; font-size:11px; font-weight:600;">Warning</div>
      <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:6px;">#D08A2C</div>
      <div style="height:14px; border-radius:3px; background:#FBF1E1; margin-top:4px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); margin-top:2px;">#FBF1E1 bg</div>
    </div>
    <div>
      <div style="height:54px; border-radius:8px; background:#C24545; display:flex; align-items:flex-end; padding:8px; color:#fff; font-size:11px; font-weight:600;">Danger</div>
      <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:6px;">#C24545</div>
      <div style="height:14px; border-radius:3px; background:#FAEAEA; margin-top:4px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); margin-top:2px;">#FAEAEA bg</div>
    </div>
    <div>
      <div style="height:54px; border-radius:8px; background:#00A9D2; display:flex; align-items:flex-end; padding:8px; color:#fff; font-size:11px; font-weight:600;">Info</div>
      <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:6px;">#00A9D2</div>
      <div style="height:14px; border-radius:3px; background:#E6F6FB; margin-top:4px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); margin-top:2px;">#E6F6FB bg</div>
    </div>
  </div>
</div></body></html>
