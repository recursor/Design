<!doctype html>
<!-- @dsCard group="Brand" name="Signature gradient" subtitle="Sampled from the wordmark" viewport="700x220" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">

  <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px;">
    <div style="text-align:center;"><div style="height:14px; border-radius:3px; background:#01B0AB; margin-bottom:6px;"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong);">#01B0AB</div><div style="font-size:10px; color:var(--fg-subtle); margin-top:2px;">I · teal</div></div>
    <div style="text-align:center;"><div style="height:14px; border-radius:3px; background:#00A9D2; margin-bottom:6px;"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong);">#00A9D2</div><div style="font-size:10px; color:var(--fg-subtle); margin-top:2px;">N · cyan</div></div>
    <div style="text-align:center;"><div style="height:14px; border-radius:3px; background:#01668E; margin-bottom:6px;"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong);">#01668E</div><div style="font-size:10px; color:var(--fg-subtle); margin-top:2px;">O · mid</div></div>
    <div style="text-align:center;"><div style="height:14px; border-radius:3px; background:#163A6D; margin-bottom:6px;"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong);">#163A6D</div><div style="font-size:10px; color:var(--fg-subtle); margin-top:2px;">V · blue</div></div>
    <div style="text-align:center;"><div style="height:14px; border-radius:3px; background:#20265A; margin-bottom:6px;"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong);">#20265A</div><div style="font-size:10px; color:var(--fg-subtle); margin-top:2px;">8 · navy</div></div>
  </div>
</div></body></html>
