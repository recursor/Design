<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation · Shadows" subtitle="Soft, navy-tinted" viewport="700x220" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card soft">
  <p class="label" style="margin:0 0 18px;">Elevation · soft, navy-tinted shadows</p>
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:18px;">
    <div style="text-align:center;"><div style="height:72px; background:#fff; border-radius:10px; box-shadow:0 1px 2px rgba(32,38,90,0.06);"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:8px;">xs</div></div>
    <div style="text-align:center;"><div style="height:72px; background:#fff; border-radius:10px; box-shadow:0 2px 6px rgba(32,38,90,0.06), 0 1px 2px rgba(32,38,90,0.04);"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:8px;">sm</div></div>
    <div style="text-align:center;"><div style="height:72px; background:#fff; border-radius:10px; box-shadow:0 8px 24px -8px rgba(32,38,90,0.16), 0 2px 6px rgba(32,38,90,0.06);"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:8px;">md · default card hover</div></div>
    <div style="text-align:center;"><div style="height:72px; background:#fff; border-radius:10px; box-shadow:0 24px 48px -16px rgba(32,38,90,0.18), 0 8px 16px -8px rgba(32,38,90,0.08);"></div><div style="font-family:var(--font-mono); font-size:10.5px; color:var(--fg-strong); margin-top:8px;">lg · modals</div></div>
  </div>
  <div style="margin-top:18px; padding:12px 14px; background:#fff; border-radius:8px; box-shadow:0 0 0 3px rgba(0,169,210,0.32); display:flex; gap:10px; align-items:center;">
    <span style="font-family:var(--font-mono); font-size:11px; color:var(--cyan-700); font-weight:600;">--shadow-focus</span>
    <span style="font-size:12px; color:var(--fg-muted);">0 0 0 3px rgba(0,169,210,0.32) · cyan focus ring</span>
  </div>
</div><script>lucide.createIcons();</script></body></html>
