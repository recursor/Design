<!-- @dsCard group="Components" height=210 subtitle="Contact / hours block" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card soft">
  <p class="label" style="margin:0 0 14px;">Information card · contact / hours</p>
  <div style="background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px;">
    <div style="font-family:var(--font-display); font-weight:400; font-size:20px; color:var(--fg-strong); margin-bottom:10px;">Houston</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--fg);"><i data-lucide="map-pin" style="width:14px; height:14px; color:var(--cyan-500); margin-top:3px; flex:0 0 14px;"></i> <span>10496 Katy Fwy Suite 101<br>Houston, TX 77043</span></div>
      <div style="display:flex; gap:10px; align-items:center; font-size:13px; color:var(--fg);"><i data-lucide="phone" style="width:14px; height:14px; color:var(--cyan-500); flex:0 0 14px;"></i> <span>(346) 571-7500</span></div>
      <div style="display:flex; gap:10px; align-items:center; font-size:13px; color:var(--fg-muted);"><i data-lucide="clock" style="width:14px; height:14px; color:var(--cyan-500); flex:0 0 14px;"></i> <span>Monday – Friday · 8:00 am – 5:00 pm</span></div>
    </div>
  </div>
</div><script>lucide.createIcons();</script></body></html>
