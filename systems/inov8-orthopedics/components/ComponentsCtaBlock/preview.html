<!-- @dsCard group="Components" height=210 subtitle="Navy + gradient wash" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card flush" style="position:relative; overflow:hidden; border-radius:0;">
  <div style="background:var(--navy-900); padding:36px 32px; color:#fff; position:relative;">
    <div style="position:absolute; inset:0; background:var(--inov8-gradient); opacity:0.18;"></div>
    <div style="position:relative; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
      <div>
        <p class="eyebrow" style="margin:0 0 8px; color:var(--cyan-300);">Schedule</p>
        <h3 style="margin:0; font-family:var(--font-display); font-weight:300; font-size:30px; color:#fff; line-height:1.15;">Ready to move without pain?</h3>
        <p style="margin:6px 0 0; font-size:14px; color:rgba(255,255,255,0.78); max-width:380px;">Request an appointment and one of our coordinators will reach out within one business day.</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button style="font-family:var(--font-body); font-size:14px; font-weight:600; padding:12px 22px; border:0; border-radius:999px; background:#fff; color:var(--navy-900); cursor:pointer;">Request appointment</button>
        <button style="font-family:var(--font-body); font-size:14px; font-weight:600; padding:12px 22px; border:1.5px solid rgba(255,255,255,0.5); border-radius:999px; background:transparent; color:#fff; cursor:pointer;">Call us</button>
      </div>
    </div>
  </div>
</div><script>lucide.createIcons();</script></body></html>
