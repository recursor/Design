<!-- @dsCard group="Components" height=180 subtitle="Pill chips, status dots, filters" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card">
  <p class="label" style="margin:0 0 14px;">Badges · chips · status</p>
  <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
    <span style="display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:var(--cyan-50); color:var(--cyan-700); font-size:12px; font-weight:600;">Outpatient</span>
    <span style="display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:var(--teal-50); color:var(--teal-700); font-size:12px; font-weight:600;">Physical Therapy</span>
    <span style="display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:#EEF0F4; color:var(--navy-900); font-size:12px; font-weight:600;">Board-Certified</span>
    <span style="display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:var(--success-50); color:var(--success-500); font-size:12px; font-weight:600;"><span style="width:6px; height:6px; border-radius:50%; background:var(--success-500);"></span> Accepting new patients</span>
    <span style="display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:var(--warning-50); color:var(--warning-500); font-size:12px; font-weight:600;">Pre-op required</span>
    <span style="display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:var(--navy-900); color:#fff; font-size:12px; font-weight:600;">AAAHC Certified</span>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:14px;">
    <span style="font-size:11px; color:var(--fg-subtle); font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-right:4px;">Filter</span>
    <span style="display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; background:var(--cyan-500); color:#fff; font-size:12px; font-weight:500;">Hip</span>
    <span style="display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; background:transparent; border:1px solid var(--border-strong); color:var(--fg-strong); font-size:12px; font-weight:500;">Knee</span>
    <span style="display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; background:transparent; border:1px solid var(--border-strong); color:var(--fg-strong); font-size:12px; font-weight:500;">Shoulder</span>
    <span style="display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; background:transparent; border:1px solid var(--border-strong); color:var(--fg-strong); font-size:12px; font-weight:500;">Elbow</span>
    <span style="display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; background:transparent; border:1px solid var(--border-strong); color:var(--fg-strong); font-size:12px; font-weight:500;">Sports Medicine</span>
  </div>
</div><script>lucide.createIcons();</script></body></html>
