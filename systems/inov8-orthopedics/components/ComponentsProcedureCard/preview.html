<!-- @dsCard group="Components" height=280 subtitle="Whole card is the link" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card soft">
  <p class="label" style="margin:0 0 14px;">Procedure tile · whole card is the link</p>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
    <div style="background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 6px rgba(32,38,90,0.06); cursor:pointer;">
      <div style="aspect-ratio:4/3; background:linear-gradient(135deg,#DDE2EA,#C4CBD7); display:flex; align-items:center; justify-content:center;">
        <i data-lucide="bone" style="width:48px; height:48px; color:#fff; opacity:0.7;"></i>
      </div>
      <div style="padding:16px 18px 18px;">
        <h4 style="margin:0 0 4px; font-family:var(--font-display); font-weight:400; font-size:20px; color:var(--fg-strong);">Hip procedures</h4>
        <hr style="border:0; height:3px; width:32px; border-radius:2px; background:var(--inov8-gradient); margin:6px 0 8px;">
        <p style="margin:0; font-size:13px; line-height:1.45; color:var(--fg-muted);">Outpatient total hip replacements, total hip revisions, and total hip arthroplasty.</p>
      </div>
    </div>
    <div style="background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 6px rgba(32,38,90,0.06); cursor:pointer;">
      <div style="aspect-ratio:4/3; background:linear-gradient(135deg,#DDE2EA,#C4CBD7); display:flex; align-items:center; justify-content:center;">
        <i data-lucide="activity" style="width:48px; height:48px; color:#fff; opacity:0.7;"></i>
      </div>
      <div style="padding:16px 18px 18px;">
        <h4 style="margin:0 0 4px; font-family:var(--font-display); font-weight:400; font-size:20px; color:var(--fg-strong);">Sports medicine</h4>
        <hr style="border:0; height:3px; width:32px; border-radius:2px; background:var(--inov8-gradient); margin:6px 0 8px;">
        <p style="margin:0; font-size:13px; line-height:1.45; color:var(--fg-muted);">Surgical and non-surgical care for exercise-related injuries to hips, knees, shoulders, and elbows.</p>
      </div>
    </div>
  </div>
</div><script>lucide.createIcons();</script></body></html>
