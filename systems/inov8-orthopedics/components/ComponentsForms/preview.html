<!-- @dsCard group="Components" height=260 subtitle="Inputs, select, focus, checkbox" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card">
  <p class="label" style="margin:0 0 14px;">Form fields</p>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:600; color:var(--fg-strong);">First name <span style="color:var(--danger-500);">*</span></span>
      <input type="text" value="Jordan" style="font-family:var(--font-body); font-size:14px; padding:10px 12px; border:1px solid var(--border); border-radius:6px; outline:none; color:var(--fg);">
    </label>
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:600; color:var(--fg-strong);">Last name <span style="color:var(--danger-500);">*</span></span>
      <input type="text" placeholder="Family name" style="font-family:var(--font-body); font-size:14px; padding:10px 12px; border:1.5px solid var(--cyan-500); border-radius:6px; outline:none; color:var(--fg); box-shadow:0 0 0 3px rgba(0,169,210,0.22);">
    </label>
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:600; color:var(--fg-strong);">Insurance provider</span>
      <select style="font-family:var(--font-body); font-size:14px; padding:10px 12px; border:1px solid var(--border); border-radius:6px; outline:none; color:var(--fg); background:#fff;">
        <option>Select your provider…</option>
      </select>
    </label>
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:600; color:var(--fg-strong);">Preferred date</span>
      <input type="text" value="06 / 14 / 2026" style="font-family:var(--font-body); font-size:14px; padding:10px 12px; border:1px solid var(--border); border-radius:6px; outline:none; color:var(--fg);">
    </label>
  </div>
  <label style="display:flex; align-items:flex-start; gap:10px; margin-top:14px; cursor:pointer;">
    <span style="width:18px; height:18px; border-radius:4px; background:var(--cyan-500); display:inline-flex; align-items:center; justify-content:center; flex:0 0 18px;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </span>
    <span style="font-size:13px; color:var(--fg); line-height:1.45;">I agree to be contacted by INOV8 Orthopedics and have read the <a href="#">Privacy Policy</a>.</span>
  </label>
</div><script>lucide.createIcons();</script></body></html>
