<!-- @dsCard group="UI Kit — Website" height=1100 subtitle="inov8ortho.com recreation — header through procedure grid" page -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>INOV8 Orthopedics \u2014 UI kit recreation</title>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg); }
    * { box-sizing: border-box; }
    button { font: inherit; }
    /* refresh lucide icons whenever the dom changes */
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Physicians.jsx"></script>
  <script type="text/babel" src="Procedures.jsx"></script>
  <script type="text/babel" src="Mission.jsx"></script>
  <script type="text/babel" src="Appointment.jsx"></script>
  <script type="text/babel" src="LocationAndFooter.jsx"></script>

  <script type="text/babel">
    function App() {
      const [activeNav, setActiveNav] = React.useState('home');
      const [selectedProc, setSelectedProc] = React.useState(null);

      const scrollToAppointment = () => {
        const el = document.getElementById('appointment');
        if (el) el.scrollTo ? null : null;
        if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
      };

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <div data-screen-label="01 INOV8 Orthopedics \u2014 Home">
          <Header activeNav={activeNav} onNav={setActiveNav} onRequest={scrollToAppointment} />
          <main>
            <Hero onRequest={scrollToAppointment} />
            <PhysiciansSection onRequest={scrollToAppointment} />
            <ProceduresSection selected={selectedProc} onSelect={setSelectedProc} />
            <MissionSection onRequest={scrollToAppointment} />
            <AppointmentSection />
            <LocationSection />
          </main>
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
