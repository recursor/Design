<!-- @dsCard group="Components" height=220 subtitle="Portrait · name · CTAs" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card soft">
  <p class="label" style="margin:0 0 14px;">Physician card</p>
  <div style="background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px; display:grid; grid-template-columns:120px 1fr; gap:18px; align-items:center;">
    <div style="aspect-ratio:1; border-radius:10px; background:linear-gradient(135deg,#DDE2EA,#97A0B0); display:flex; align-items:center; justify-content:center;">
      <i data-lucide="user-round" style="width:54px; height:54px; color:#fff; opacity:0.8;"></i>
    </div>
    <div>
      <div style="font-family:var(--font-display); font-weight:300; font-size:28px; line-height:1.1; color:var(--fg-strong);">Stefan <strong style="font-weight:600;">Kreuzer</strong></div>
      <div style="font-family:var(--font-body); font-size:12px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--fg-subtle); margin-top:4px;">M.D., MSc</div>
      <div style="font-size:12px; color:var(--brand-strong); margin-top:2px; font-weight:500;">Board-Certified Orthopedic Surgeon</div>
      <p style="margin:8px 0 10px; font-size:13px; line-height:1.45; color:var(--fg-muted);">Specializes in outpatient total joint replacement and computer-assisted joint replacement surgery.</p>
      <div style="display:flex; gap:8px;">
        <button style="font-family:var(--font-body); font-size:12px; font-weight:600; padding:7px 14px; border:0; border-radius:999px; background:var(--cyan-500); color:#fff; cursor:pointer;">Book online</button>
        <button style="font-family:var(--font-body); font-size:12px; font-weight:500; padding:7px 14px; border:1px solid var(--border); border-radius:999px; background:#fff; color:var(--fg-strong); cursor:pointer; display:inline-flex; align-items:center; gap:5px;"><i data-lucide="phone" style="width:11px; height:11px;"></i> (346) 571-7500</button>
      </div>
    </div>
  </div>
</div><script>lucide.createIcons();</script></body></html>
