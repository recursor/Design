<!-- @dsCard group="Components" height=190 subtitle="Pill CTAs · primary, secondary, ghost" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card">
  <p class="label" style="margin:0 0 14px;">Buttons · pill CTA primary</p>
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
    <button style="font-family:var(--font-body); font-size:14px; font-weight:600; padding:12px 22px; border:0; border-radius:999px; background:var(--cyan-500); color:#fff; cursor:pointer; box-shadow:0 2px 6px rgba(32,38,90,0.06);">Request appointment</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:600; padding:12px 22px; border:1.5px solid var(--cyan-500); border-radius:999px; background:#fff; color:var(--cyan-700); cursor:pointer;">Book online</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:600; padding:12px 22px; border:0; border-radius:999px; background:var(--navy-900); color:#fff; cursor:pointer;">Call (346) 571-7500</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:500; padding:8px 14px; border:0; border-radius:8px; background:transparent; color:var(--cyan-700); cursor:pointer; display:inline-flex; align-items:center; gap:6px;">Learn more <i data-lucide="chevron-right" style="width:14px; height:14px;"></i></button>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px;">
    <button style="font-family:var(--font-body); font-size:13px; font-weight:600; padding:8px 16px; border:0; border-radius:999px; background:var(--cyan-500); color:#fff; cursor:pointer;">Sm</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:600; padding:12px 22px; border:0; border-radius:999px; background:var(--cyan-500); color:#fff; cursor:pointer;">Md</button>
    <button style="font-family:var(--font-body); font-size:16px; font-weight:600; padding:16px 28px; border:0; border-radius:999px; background:var(--cyan-500); color:#fff; cursor:pointer;">Lg</button>
    <span style="font-family:var(--font-mono); font-size:11px; color:var(--fg-subtle); margin-left:6px;">sm · md ★ · lg</span>
  </div>
</div><script>lucide.createIcons();</script></body></html>
