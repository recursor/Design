<!-- @dsCard group="Components" height=130 subtitle="Logo + utility row + primary nav" page -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
<div class="card flush" style="background:#fff;">
  <div style="padding:14px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--divider);">
    <img src="../assets/inov8-logo.png" style="height:30px;">
    <div style="display:flex; align-items:center; gap:6px;">
      <button style="font-family:var(--font-body); font-size:12px; font-weight:600; padding:7px 14px; border:1px solid var(--border); border-radius:999px; background:#fff; color:var(--fg-strong); cursor:pointer; display:inline-flex; align-items:center; gap:5px;"><i data-lucide="phone" style="width:11px; height:11px;"></i> Call us</button>
      <button style="font-family:var(--font-body); font-size:12px; font-weight:600; padding:7px 14px; border:0; border-radius:999px; background:var(--cyan-500); color:#fff; cursor:pointer;">Request appointment</button>
    </div>
  </div>
  <nav style="padding:10px 24px; display:flex; gap:22px; align-items:center;">
    <a style="font-size:13px; font-weight:500; color:var(--fg-strong); text-decoration:none;">Home</a>
    <a style="font-size:13px; font-weight:500; color:var(--fg-strong); text-decoration:none; display:inline-flex; align-items:center; gap:3px;">About <i data-lucide="chevron-down" style="width:12px; height:12px;"></i></a>
    <a style="font-size:13px; font-weight:600; color:var(--cyan-700); text-decoration:none; display:inline-flex; align-items:center; gap:3px; border-bottom:2px solid var(--cyan-500); padding-bottom:4px; margin-bottom:-6px;">Procedures <i data-lucide="chevron-down" style="width:12px; height:12px;"></i></a>
    <a style="font-size:13px; font-weight:500; color:var(--fg-strong); text-decoration:none;">Patients</a>
    <a style="font-size:13px; font-weight:500; color:var(--fg-strong); text-decoration:none;">Referring Doctors</a>
    <a style="font-size:13px; font-weight:500; color:var(--fg-strong); text-decoration:none;">Media</a>
    <a style="font-size:13px; font-weight:500; color:var(--fg-strong); text-decoration:none;">Contact</a>
  </nav>
</div><script>lucide.createIcons();</script></body></html>
