<body>

  <script type="text/babel" data-presets="env,react">
// ===== Header.jsx =====
// Header.jsx — INOV8 Orthopedics top utility bar + logo + primary nav.
// Sticky on scroll with a subtle backdrop blur; matches the live
// site's IA: Home · About · Procedures · Patients · Referring Doctors
// · Media · FAQ · Contact · Request Appointment.

function Header({ activeNav, onNav, onRequest }) {
  const items = [
    { id: 'home',       label: 'Home' },
    { id: 'about',      label: 'About',          hasMenu: true },
    { id: 'procedures', label: 'Procedures',     hasMenu: true },
    { id: 'patients',   label: 'Patients' },
    { id: 'referring',  label: 'Referring Doctors' },
    { id: 'media',      label: 'Media' },
    { id: 'faq',        label: 'FAQ' },
    { id: 'contact',    label: 'Contact' },
  ];

  return (
    <header style={headerStyles.root}>
      {/* Utility row */}
      <div style={headerStyles.utility}>
        <div style={headerStyles.utilityInner}>
          <a href="tel:3465717500" style={headerStyles.utilityLink}>
            <i data-lucide="phone" style={{ width: 12, height: 12 }}></i> (346) 571-7500
          </a>
          <span style={{ color: 'rgba(255,255,255,0.35)' }}>·</span>
          <a href="#" style={headerStyles.utilityLink}>
            <i data-lucide="map-pin" style={{ width: 12, height: 12 }}></i> 10496 Katy Fwy, Houston, TX
          </a>
          <span style={{ color: 'rgba(255,255,255,0.35)' }}>·</span>
          <span style={{ ...headerStyles.utilityLink, opacity: 0.85 }}>Mon – Fri  8:00 am – 5:00 pm</span>
        </div>
      </div>

      {/* Logo + nav row */}
      <div style={headerStyles.bar}>
        <div style={headerStyles.barInner}>
          <a href="#" onClick={(e) => { e.preventDefault(); onNav && onNav('home'); }} style={{ display: 'flex' }}>
            <img src={window.__resources.logo} alt="INOV8 Orthopedics" style={{ height: 42 }} />
          </a>

          <nav style={headerStyles.nav}>
            {items.map((item) => {
              const active = activeNav === item.id;
              return (
                <a
                  key={item.id}
                  href="#"
                  onClick={(e) => { e.preventDefault(); onNav && onNav(item.id); }}
                  style={{ ...headerStyles.navLink, ...(active ? headerStyles.navLinkActive : null) }}
                >
                  {item.label}
                  {item.hasMenu && <i data-lucide="chevron-down" style={{ width: 12, height: 12, marginLeft: 3 }}></i>}
                </a>
              );
            })}
          </nav>

          <button onClick={onRequest} style={headerStyles.cta}>Request appointment</button>
        </div>
      </div>
    </header>
  );
}

const headerStyles = {

  bar: { background: 'rgba(255,255,255,0.94)', backdropFilter: 'blur(12px)' },

// ===== Hero.jsx =====
// Hero.jsx — full-width hero section with eyebrow / display heading /
// gradient rule / lead / CTA pair / right-side image placeholder.
// Matches the live site's hero copy verbatim.

function Hero({ onRequest }) {
  return (
    <section style={heroStyles.section}>
      <div style={heroStyles.inner}>
        <div style={heroStyles.text}>
          <p className="eyebrow" style={{ margin: 0, color: 'var(--cyan-600)' }}>Welcome to INOV8 Orthopedics</p>

          </h1>
          <hr className="gradient-rule" />
          <p style={heroStyles.lead}>
            Innovative orthopedic care for exceptional patient outcomes. Our team specializes in outpatient
            total joint replacement and the full range of musculoskeletal, orthopedic, and arthritic conditions.
          </p>
          <div style={heroStyles.ctas}>
            <button onClick={onRequest} style={heroStyles.primary}>Request appointment</button>
            <a href="tel:3465717500" style={heroStyles.secondary}>
              <i data-lucide="phone" style={{ width: 14, height: 14 }}></i> (346) 571-7500

          </div>
          <div style={heroStyles.proof}>
            <Stat n="4" label="Board-certified surgeons" />
            <Divider />
            <Stat n="6" label="Specialty areas" />
            <Divider />
            <Stat n="1" label="ASC in Texas with AAAHC orthopedic certification" small />

        <div style={heroStyles.media}>

            <div style={heroStyles.mediaImg}>
              <i data-lucide="image" style={{ width: 48, height: 48, color: '#fff', opacity: 0.6 }}></i>

      </div>

  );
}

function Stat({ n, label, small }) {
  return (
    <div>
      <div style={{ fontFamily: 'var(--font-display)', fontWeight: 300, fontSize: 38, lineHeight: 1, color: 'var(--fg-strong)' }}>{n}</div>
      <div style={{ fontSize: small ? 11 : 12, color: 'var(--fg-muted)', marginTop: 4, maxWidth: 160, lineHeight: 1.35 }}>{label}</div>
    </div>
  );
}
function Divider() {
  return <div style={{ width: 1, alignSelf: 'stretch', background: 'var(--divider)' }} />;
}

// Procedures.jsx — anatomy-organized procedure tiles.
// Order matches the live site: Hip, Knee, Shoulder, Elbow,
// Sports Medicine, Physical Therapy.

  { id: 'hip',      title: 'Hip procedures',      icon: 'bone',
    blurb: 'Traditional and outpatient total hip replacements, total hip revisions, and total hip arthroplasty.' },
  { id: 'knee',     title: 'Knee procedures',     icon: 'activity',

function ProceduresSection({ onSelect, selected }) {
  return (
    <section style={procStyles.section}>
      <div style={procStyles.inner}>
        <header style={procStyles.head}>
          <p className="eyebrow" style={{ margin: 0 }}>Procedures &amp; Conditions</p>
          <h2 style={procStyles.h2}>Our innovative orthopedic procedures</h2>
          <hr className="gradient-rule" />
        </header>

        <div style={procStyles.grid}>
          {PROCEDURES.map((p) => (
            <ProcedureTile
              key={p.id}
              proc={p}
              active={selected === p.id}
              onClick={() => onSelect && onSelect(p.id)}
            />
          ))}
        </div>
      </div>
    </section>
  );
}

function ProcedureTile({ proc, active, onClick }) {
  const [hover, setHover] = React.useState(false);
  const lifted = hover || active;
  return (
    <article
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      onClick={onClick}
      style={{ ...procStyles.tile, transform: lifted ? 'translateY(-3px)' : 'translateY(0)', boxShadow: lifted ? '0 24px 48px -16px rgba(32,38,90,0.18), 0 8px 16px -8px rgba(32,38,90,0.08)' : '0 2px 6px rgba(32,38,90,0.06), 0 1px 2px rgba(32,38,90,0.04)' }}
    >
      <div style={procStyles.image}>
        <i data-lucide={proc.icon} style={{ width: 56, height: 56, color: '#fff', opacity: 0.7, transform: lifted ? 'scale(1.06)' : 'scale(1)', transition: 'transform var(--dur-base) var(--ease-out)' }}></i>
      </div>
      <div style={procStyles.body}>
        <h3 style={procStyles.title}>{proc.title}</h3>
        <hr style={{ ...procStyles.rule, width: lifted ? 56 : 32 }} />
        <p style={procStyles.blurb}>{proc.blurb}</p>
        <div style={procStyles.more}>
          Learn more <i data-lucide="chevron-right" style={{ width: 12, height: 12 }}></i>
        </div>
      </div>
    </article>
  );
}

          <p style={missionStyles.body}>

// ===== Appointment.jsx =====
// Appointment.jsx — request-appointment form, mirrors the form on
// the live site. Renders fully interactive (state local) — submits
// flip to a success state and back via a "Request another" button.

function AppointmentSection() {
  const [state, setState] = React.useState({
    first: '', last: '', phone: '', email: '',
    insurance: '', date: '', referred: '', message: '',
    consent: false,
  });
  const [submitted, setSubmitted] = React.useState(false);
  const set = (k) => (e) => setState((s) => ({ ...s, [k]: e.target ? (e.target.type === 'checkbox' ? e.target.checked : e.target.value) : e }));

  const submit = (e) => {
    e.preventDefault();
    setSubmitted(true);
  };

  return (
    <section id="appointment" style={apStyles.section}>
      <div style={apStyles.inner}>
        <header style={apStyles.head}>
          <p className="eyebrow" style={{ margin: 0 }}>Get Started</p>
          <h2 style={apStyles.h2}>Schedule your appointment</h2>
          <hr className="gradient-rule" />
          <p style={apStyles.lead}>Use the form below and a coordinator will reach out within one business day.</p>
        </header>

        <div style={apStyles.card}>
          {submitted ? (
            <div style={apStyles.success}>
              <div style={apStyles.successIcon}>
                <i data-lucide="check" style={{ width: 28, height: 28, color: '#fff' }}></i>
              </div>
              <h3 style={apStyles.successTitle}>Request received</h3>
              <p style={apStyles.successCopy}>
                Thanks{state.first ? `, ${state.first}` : ''}. A coordinator from INOV8 Orthopedics will follow up at
                {state.email ? <strong style={{ color: 'var(--fg-strong)' }}> {state.email}</strong> : ' the contact you provided'} within one business day.
              </p>
              <button onClick={() => { setSubmitted(false); setState({ first:'',last:'',phone:'',email:'',insurance:'',date:'',referred:'',message:'',consent:false }); }} style={apStyles.againBtn}>
                Request another
              </button>
            </div>
          ) : (
            <form onSubmit={submit} style={apStyles.form}>
              <Field label="First name" required>
                <input value={state.first} onChange={set('first')} style={apStyles.input} />
              </Field>
              <Field label="Last name" required>
                <input value={state.last} onChange={set('last')} style={apStyles.input} />
              </Field>
              <Field label="Phone" required>
                <input type="tel" value={state.phone} onChange={set('phone')} style={apStyles.input} />
              </Field>
              <Field label="Email" required>
                <input type="email" value={state.email} onChange={set('email')} style={apStyles.input} />
              </Field>
              <Field label="Insurance provider">
                <select value={state.insurance} onChange={set('insurance')} style={apStyles.input}>
                  <option value="">Select your provider</option>
                  <option>Blue Cross Blue Shield</option>
                  <option>Aetna</option>
                  <option>UnitedHealthcare</option>
                  <option>Cigna</option>
                  <option>Humana</option>
                  <option>Self-pay</option>
                  <option>Other</option>
                </select>
              </Field>
              <Field label="Preferred date">
                <input type="text" placeholder="MM / DD / YYYY" value={state.date} onChange={set('date')} style={apStyles.input} />
              </Field>
              <Field label="Referred by" full>
                <input value={state.referred} onChange={set('referred')} placeholder="Physician, friend, online search…" style={apStyles.input} />
              </Field>
              <Field label="What can we do for you?" required full>
                <textarea value={state.message} onChange={set('message')} rows={4} style={{ ...apStyles.input, resize: 'vertical' }} />
              </Field>
              <label style={apStyles.consent}>
                <input type="checkbox" checked={state.consent} onChange={set('consent')} style={{ accentColor: 'var(--cyan-500)', width: 16, height: 16 }} />
                <span>I agree to be contacted by INOV8 Orthopedics and have read the <a href="#" style={{ color: 'var(--cyan-700)' }}>Privacy Policy</a>.</span>
              </label>
              <div style={apStyles.actions}>
                <button type="submit" style={apStyles.submit}>Request appointment</button>
                <p style={apStyles.disclaimer}>Required fields are marked with <span style={{ color: 'var(--danger-500)' }}>*</span>. This form does not transmit protected health information.</p>
              </div>
            </form>
          )}
        </div>
      </div>
    </section>
  );
}

function Field({ label, required, full, children }) {
  return (
    <label style={{ display: 'flex', flexDirection: 'column', gap: 6, gridColumn: full ? '1 / -1' : 'auto' }}>
      <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--fg-strong)' }}>
        {label}{required && <span style={{ color: 'var(--danger-500)', marginLeft: 3 }}>*</span>}
      </span>
      {children}
    </label>
  );
}
